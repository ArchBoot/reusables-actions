name: Detect Sonar Analysis Context
description: Determines whether the current run is a branch or PR analysis and exposes the right Sonar parameters.

outputs:
  analysis_type:
    description: branch or pull request
    value: ${{  }}
  branch_name:
    description: Branch name (only for btanch analysis)
    value: ${{  }}
  pr_key:
    description: PR number (only for pull request analysis
    value: ${{  }}
  pr_branch:
    description: Head branch of the PR
    value: ${{  }}
  pr_base:
    description: Base branch of the PR
    value: ${{  }}

runs:
  using: composite
  steps:
    - name: Resolve context
      id: context
      shell: bash
      run: ${{ github.action_path }}/scripts/detect-context.sh