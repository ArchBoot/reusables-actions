name: Setup Environment
description: Setup environment to used by the repository

inputs:
  stack:
    description: The technology stack to set up (e.g., java-maven, node-npm)
    required: true
  stack_version:
    description: The version of the stack to set up (e.g., 21 for java-maven, 20 for node-npm)
    required: false

runs:
  using: composite
  steps:
    - name: Setup Java
      if: ${{ inputs.stack == 'java-maven' }}
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: ${{ inputs.stack_version || '21' }}

    - name: Setup Node.js
      if: ${{ inputs.stack == 'node-npm' }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.stack_version || '22' }}

